<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World - 我的第一个AI开发的网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 60px 80px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .name {
      color: #ffd700;
      font-weight: 700;
    }
    .time-box {
      margin-top: 30px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
    }
    .time-label {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-bottom: 8px;
    }
    #serverTime {
      font-size: 1.6rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World！<br/>我是<span class="name">【你的名字】</span>，<br/>我的第一个AI开发的网站</h1>
    <div class="time-box">
      <div class="time-label">当前时间</div>
      <div id="serverTime">加载中...</div>
    </div>
  </div>

  <script>
    function updateTime() {
      const now = new Date();
      // 格式化成中文时间：2026/10/29 15:30:45
      const timeStr = now.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      document.getElementById('serverTime').textContent = timeStr;
    }
    // 首次加载
    updateTime();
    // 每秒刷新一次
    setInterval(updateTime, 1000);
  </script>
</body>
</html>
